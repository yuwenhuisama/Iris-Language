[package]
name = "iris-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# C078/C079: the engine enforces the linear-time, no-backtracking subset.
regex = "1"
# C042 pins Unicode data to 17.0.0 and this crate's UNICODE_VERSION is exactly
# (17, 0, 0), so C044 graphemes use the required UAX#29 tables.
unicode-segmentation = "1.13"
# IRIS-V1-COLLECTIONS-C042 pins Unicode data to 17.0.0. Both crates report
# UNICODE_VERSION (17, 0, 0), so identifier XID tables, normalization and
# casefold use the required tables rather than the host's.
unicode-normalization = "0.1"
unicode-properties = "0.1"
# C042 also governs casefold and the identifier XID tables. `caseless` was
# rejected: its case_folding_data declares UNICODE_VERSION (16, 0, 0). ICU
# accepts U+1C89 as XID_Start, which IRIS-V1-COLLECTIONS-V334 names as the
# 17.0.0 discriminator.
icu_casemap = "2"
icu_properties = "2"
iris-lexer = { path = "../iris-lexer" }
iris-parser = { path = "../iris-parser" }
iris-runtime = { path = "../iris-runtime" }
iris-syntax = { path = "../iris-syntax" }
