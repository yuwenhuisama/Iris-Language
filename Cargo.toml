[workspace]
members = [
    "crates/iris-builtins",
    "crates/iris-lexer",
    "crates/iris-syntax",
    "crates/iris-parser",
    "crates/iris-eval",
    "crates/iris-cli",
    "crates/iris-conformance",
    "crates/iris-abi",
    "crates/iris-runtime",
    "crates/iris-vm",
    "crates/iris-native-sdk",
    "crates/iris-native-host",
    "crates/iris-package",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"
version = "0.1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
